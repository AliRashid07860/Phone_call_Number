<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Call QR Generator</title>

    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef1f5;
            color: #111827;
        }

        /* =========================
           GENERATOR SECTION
        ========================= */

        .generator-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .generator-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 32px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .phone-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .generator-card h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .generator-card p {
            color: #667085;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #d0d5dd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #2563eb;
        }

        .generate-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #1d4ed8;
        }

        .error {
            display: none;
            color: #dc2626;
            font-size: 13px;
            margin-top: 7px;
        }


        /* =========================
           QR RESULT SECTION
        ========================= */

        .result-section {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 55px 15px;
        }

        .result-card {
            width: 100%;
            max-width: 500px;
            background: #ffffff;
            padding: 40px 30px 35px;
            border-radius: 28px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .result-icon {
            font-size: 52px;
            margin-bottom: 10px;
        }

        .result-card h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .result-description {
            color: #667085;
            font-size: 17px;
            line-height: 1.45;
            max-width: 410px;
            margin: 0 auto 30px;
        }


        /* =========================
           QR CODE
        ========================= */

        #qrcode {
            width: 310px;
            height: 310px;
            margin: 0 auto 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: white;
        }

        #qrcode canvas {
            width: 290px !important;
            height: 290px !important;
        }

        #qrcode img {
            width: 290px;
            height: 290px;
        }


        /* =========================
           BUTTONS
        ========================= */

        .download-btn,
        .call-btn,
        .back-btn {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 13px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .download-btn {
            background: #111827;
            color: white;
            margin-bottom: 15px;
        }

        .download-btn:hover {
            background: #000000;
        }

        .call-btn {
            background: #16a34a;
            color: white;
            margin-bottom: 25px;
        }

        .call-btn:hover {
            background: #15803d;
        }

        .back-btn {
            height: 50px;
            background: #f2f4f7;
            color: #344054;
            font-size: 15px;
        }

        .back-btn:hover {
            background: #e4e7ec;
        }

        .bottom-text {
            color: #8a8f98;
            font-size: 14px;
            margin-top: 5px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .generator-section {
                padding: 15px;
            }

            .generator-card {
                padding: 28px 20px;
                border-radius: 22px;
            }

            .generator-card h1 {
                font-size: 25px;
            }

            .result-section {
                padding: 20px 10px;
            }

            .result-card {
                padding: 32px 18px 30px;
                border-radius: 24px;
            }

            .result-card h2 {
                font-size: 30px;
            }

            .result-description {
                font-size: 16px;
            }

            #qrcode {
                width: 280px;
                height: 280px;
                margin-bottom: 30px;
            }

            #qrcode canvas {
                width: 260px !important;
                height: 260px !important;
            }

            #qrcode img {
                width: 260px;
                height: 260px;
            }

            .download-btn,
            .call-btn {
                height: 58px;
                font-size: 17px;
            }
        }


        @media (max-width: 350px) {

            .result-card {
                padding-left: 12px;
                padding-right: 12px;
            }

            #qrcode {
                width: 240px;
                height: 240px;
            }

            #qrcode canvas {
                width: 225px !important;
                height: 225px !important;
            }

            #qrcode img {
                width: 225px;
                height: 225px;
            }

            .result-card h2 {
                font-size: 27px;
            }
        }
    </style>
</head>


<body>


    <!-- =========================
         GENERATOR PAGE
    ========================== -->

    <section class="generator-section" id="generator">

        <div class="generator-card">

            <div class="phone-icon">
                📞
            </div>

            <h1>Call QR Generator</h1>

            <p>
                Enter a phone number and generate
                a QR code for quick calling.
            </p>

            <div class="input-box">

                <label for="phoneNumber">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="Enter phone number"
                    inputmode="tel"
                >

                <div class="error" id="error">
                    Please enter a valid phone number.
                </div>

            </div>

            <button
                class="generate-btn"
                onclick="generateQR()"
            >
                Generate QR Code
            </button>

        </div>

    </section>


    <!-- =========================
         QR RESULT PAGE
    ========================== -->

    <section
        class="result-section hidden"
        id="result"
    >

        <div class="result-card">

            <div class="result-icon">
                📞
            </div>

            <h2>
                Scan to Call
            </h2>

            <p class="result-description">
                Scan the QR code using your mobile
                phone to start a call.
            </p>


            <!-- QR CODE -->

            <div id="qrcode"></div>


            <!-- DOWNLOAD -->

            <button
                class="download-btn"
                onclick="downloadQR()"
            >
                ⬇️ Download QR Code
            </button>


            <!-- CALL NOW -->

            <button
                class="call-btn"
                onclick="callNumber()"
            >
                📞 Call Now
            </button>


            <p class="bottom-text">
                Scan the QR code with your mobile camera.
            </p>


            <!-- BACK -->

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ↑ Generate Another QR
            </button>

        </div>

    </section>


    <script>

        let currentNumber = "";


        // =========================
        // GENERATE QR
        // =========================

        function generateQR() {

            const input =
                document.getElementById("phoneNumber");

            const error =
                document.getElementById("error");

            let number =
                input.value.trim();


            // Remove spaces, brackets and hyphens

            number =
                number.replace(/[\s()-]/g, "");


            // Validation

            if (!number) {

                error.style.display = "block";

                error.textContent =
                    "Please enter a phone number.";

                return;
            }


            if (!/^\+?\d{7,15}$/.test(number)) {

                error.style.display = "block";

                error.textContent =
                    "Please enter a valid phone number.";

                return;
            }


            error.style.display = "none";


            // If 10 digit Indian number
            // automatically add +91

            if (/^\d{10}$/.test(number)) {

                number = "+91" + number;
            }


            currentNumber = number;


            // Clear previous QR

            const qr =
                document.getElementById("qrcode");

            qr.innerHTML = "";


            // Generate REAL QR

            new QRCode(qr, {

                text: "tel:" + currentNumber,

                width: 290,

                height: 290,

                correctLevel:
                    QRCode.CorrectLevel.H

            });


            // Show result

            const result =
                document.getElementById("result");

            result.classList.remove("hidden");


            // Smooth slide / scroll

            setTimeout(function () {

                result.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }, 150);

        }


        // =========================
        // DOWNLOAD QR
        // =========================

        function downloadQR() {

            const canvas =
                document.querySelector("#qrcode canvas");


            if (!canvas) {

                alert("Please generate a QR code first.");

                return;
            }


            const link =
                document.createElement("a");


            link.download =
                "Call-QR-Code.png";


            link.href =
                canvas.toDataURL("image/png");


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

        }


        // =========================
        // CALL NOW
        // =========================

        function callNumber() {

            if (!currentNumber) {

                return;
            }

            window.location.href =
                "tel:" + currentNumber;

        }


        // =========================
        // GO BACK
        // =========================

        function goBack() {

            document.getElementById("generator")
                .scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

        }

    </script>

</body>

</html>
